<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>商店编辑器 · FYServer</title>
  <link rel="stylesheet" href="/admin-ui/assets/admin-v4.css?v=20260923-2" />
  <style>
    .store-layout{display:grid;grid-template-columns:220px 250px minmax(0,1fr);gap:16px;align-items:start}
    .store-list{display:grid;gap:6px;max-height:620px;overflow:auto}
    .store-list button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:1px solid var(--outline);border-radius:11px;padding:9px 10px;background:transparent;color:var(--text);cursor:pointer;font:13px var(--app-font)}
    .store-list button:hover,.store-list button.active{background:rgba(var(--primary-rgb),.1);border-color:var(--primary);color:var(--primary)}
    .store-list small{color:var(--muted);font-size:10px}.store-section{border-top:1px solid var(--outline);padding-top:15px;margin-top:15px}
    .reward-row{border:1px solid var(--outline);border-radius:12px;padding:10px;margin:8px 0;background:rgba(var(--primary-rgb),.025)}
    .reward-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.reward-head b{font-size:12px}.reward-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
    .reward-grid .field{margin:0}.reward-grid .field>span{font-size:10px}.store-json{min-height:260px}.sticky-editor{position:sticky;top:86px}
    @media(max-width:1120px){.store-layout{grid-template-columns:190px 220px minmax(0,1fr)}}
    @media(max-width:900px){.store-layout{grid-template-columns:1fr 1fr}.store-editor{grid-column:1/-1}.sticky-editor{position:static}}
    @media(max-width:560px){.store-layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="page">
  <div id="banner-host"></div>
  <div class="page-head"><h1>商店物品编辑器</h1><p>参考重建后台的分组、商品和奖励槽位管理；保存前服务器会备份 <span class="mono">config/store.json.bak</span>。</p></div>
  <section class="card">
    <div class="btn-row">
      <label class="field" style="margin:0;min-width:150px"><span>商店货币标识</span><input id="currency" maxlength="16" /></label>
      <button class="btn" id="save" type="button">保存并生效</button><button class="btn btn--outline" id="reload" type="button">重新读取</button>
      <button class="btn btn--outline" id="download" type="button">导出 JSON</button><span class="muted" id="store-path"></span>
    </div>
  </section>
  <div class="store-layout">
    <section class="card"><div class="btn-row"><h2 style="flex:1;margin:0">分组</h2><button class="btn btn--small" id="add-group" type="button">新增</button></div><div class="store-list" id="groups"></div></section>
    <section class="card"><div class="btn-row"><h2 style="flex:1;margin:0">商品</h2><button class="btn btn--small" id="add-offer" type="button">新增</button></div><div class="store-list" id="offers"></div></section>
    <section class="card store-editor sticky-editor">
      <div class="btn-row"><h2 style="flex:1;margin:0" id="editor-title">选择一个商品</h2><button class="btn btn--danger btn--small" id="delete" type="button">删除</button></div>
      <div id="empty-editor" class="muted" style="padding:28px 0">从左侧选择分组和商品，或新建一个商品。</div>
      <div id="editor" hidden>
        <div class="store-section" style="border-top:0;padding-top:0"><h3>分组设置</h3><div class="form-grid">
          <label class="field"><span>groupId</span><input id="group-id" type="number" /></label><label class="field"><span>group</span><input id="group-type" type="number" /></label>
          <label class="field"><span>开始时间</span><input id="group-start" type="text" placeholder="2026-01-01T00:00:00Z" /></label><label class="field"><span>结束时间</span><input id="group-end" type="text" placeholder="2099-01-01T00:00:00Z" /></label>
        </div><div class="btn-row"><label><input id="group-hidden" type="checkbox" /> 隐藏分组</label><span class="muted" id="group-kind"></span></div></div>
        <div class="store-section"><h3>商品信息</h3><div class="form-grid">
          <label class="field"><span>offerId</span><input id="offer-id" type="number" /></label><label class="field"><span>offerName</span><input id="offer-name" /></label><label class="field"><span>标题</span><input id="offer-title" /></label>
          <label class="field"><span>金币价格</span><input id="offer-gold" type="number" min="0" /></label><label class="field"><span>钻石价格</span><input id="offer-diamonds" type="number" min="0" /></label><label class="field"><span>真实货币价格</span><input id="offer-real" type="number" min="0" step="0.01" /></label>
          <label class="field"><span>限购次数（0=不限）</span><input id="offer-limit" type="number" min="0" /></label><label class="field"><span>优先级</span><input id="offer-priority" type="number" min="0" /></label><label class="field"><span>slotType</span><input id="offer-slot" /></label>
          <label class="field"><span>slotValue</span><input id="offer-slot-value" /></label><label class="field"><span>fulfilAfter</span><input id="offer-fulfil" /></label>
          <label class="field"><span>缩略图 URL</span><input id="offer-thumb" /></label><label class="field"><span>主图 URL</span><input id="offer-main" /></label><label class="field"><span>小图 URL</span><input id="offer-small" /></label>
        </div><label class="field"><span>描述</span><textarea id="offer-description"></textarea></label></div>
        <div class="store-section"><div class="btn-row"><h3 style="flex:1">奖励条目</h3><button class="btn btn--outline btn--small" data-add-reward="items" type="button">添加主奖励</button><button class="btn btn--outline btn--small" data-add-reward="bonusItems" type="button">添加奖励加成</button></div><div id="items"></div><h3 style="margin-top:18px">奖励加成</h3><div id="bonusItems"></div></div>
        <details class="store-section"><summary><b>完整 JSON（高级编辑）</b></summary><p class="muted">用于保留或修改表单未覆盖的客户端字段。点击“应用 JSON”后再保存。</p><textarea id="raw" class="json store-json" spellcheck="false"></textarea><div class="btn-row" style="margin-top:8px"><button class="btn btn--outline btn--small" id="apply-raw" type="button">应用 JSON</button><button class="btn btn--outline btn--small" id="format-raw" type="button">格式化</button></div></details>
      </div>
    </section>
  </div>
</main>
<footer class="page-footer">FYServer · Server Control Center</footer>
<script src="/admin-ui/assets/admin-v4.js?v=20260920-1"></script>
<script>
(async function(){
  if(!await Admin.ensureAuth())return; Admin.mount('store','商店编辑器');
  const $=id=>document.getElementById(id), num=(v,d=0)=>{const n=Number(v);return Number.isFinite(n)?n:d};
  let state=null, selectedGroup='featured', selectedOffer=-1;
  const emptyGroup=()=>({groupId:Math.max(-1,...(state?.groups||[]).map(g=>num(g.groupId,-1)))+1,group:4,startDate:new Date().toISOString(),endDate:'2099-01-01T00:00:00Z',offers:[]});
  const emptyOffer=()=>({offerId:Math.max(0,...allOffers().map(o=>num(o.offerId)))+1,offerName:'new_offer',title:'新商品',description:'',items:[{data:{itemType:'gold'},qty:1}],bonusItems:[],gold:0,diamonds:0,limit:0});
  function allOffers(){return [state?.alwaysFeatured,...(state?.groups||[])].flatMap(g=>g?.offers||[])}
  function normalize(c){c=c||{};c.currency=c.currency||'USD';c.groups=Array.isArray(c.groups)?c.groups:[];c.alwaysFeatured=c.alwaysFeatured||{group:1,groupId:-1,startDate:'2018-01-01T00:00:00Z',endDate:'2099-01-01T00:00:00Z',offers:[]};for(const g of [c.alwaysFeatured,...c.groups]){g.offers=Array.isArray(g.offers)?g.offers:[];for(const o of g.offers){o.items=Array.isArray(o.items)?o.items:[];o.bonusItems=Array.isArray(o.bonusItems)?o.bonusItems:[]}}return c}
  function group(){return selectedGroup==='featured'?state.alwaysFeatured:state.groups.find(g=>String(g.groupId)===String(selectedGroup))}
  function renderGroups(){const host=$('groups');host.innerHTML='';const list=[['featured',state.alwaysFeatured,'常驻精选'],...state.groups.map(g=>[String(g.groupId),g,'分组'])];for(const [key,g,label] of list){const b=document.createElement('button');b.className=key===String(selectedGroup)?'active':'';b.innerHTML='<span>'+label+' '+Admin.esc(g.groupId??'')+'</span><small>'+((g.offers||[]).length)+' 件</small>';b.onclick=()=>{selectedGroup=key;selectedOffer=-1;renderAll()};host.appendChild(b)}}
  function renderOffers(){const host=$('offers');host.innerHTML='';const g=group();if(!g){return}for(const [i,o] of (g.offers||[]).entries()){const b=document.createElement('button');b.className=i===selectedOffer?'active':'';b.innerHTML='<span>'+Admin.esc(o.title||o.offerName||'未命名')+'</span><small>#'+Admin.esc(o.offerId||'')+'</small>';b.onclick=()=>{selectedOffer=i;renderAll()};host.appendChild(b)}if(!g.offers.length)host.innerHTML='<div class="empty">此分组暂无商品</div>'}
  function value(id,v){$(id).value=v==null?'':v}
  function renderEditor(){const g=group(),o=g?.offers?.[selectedOffer];$('empty-editor').hidden=!!o;$('editor').hidden=!o;$('delete').disabled=!o;if(!o)return;$('editor-title').textContent=(o.title||o.offerName||'编辑商品')+' · #'+o.offerId;
    value('group-id',g.groupId);value('group-type',g.group);value('group-start',g.startDate);value('group-end',g.endDate);$('group-hidden').checked=!!g.hidden;$('group-kind').textContent=selectedGroup==='featured'?'alwaysFeatured':'普通分组';
    for(const [id,key] of [['offer-id','offerId'],['offer-name','offerName'],['offer-title','title'],['offer-gold','gold'],['offer-diamonds','diamonds'],['offer-real','real'],['offer-limit','limit'],['offer-priority','priority'],['offer-slot','slotType'],['offer-slot-value','slotValue'],['offer-fulfil','fulfilAfter'],['offer-thumb','thumbnail'],['offer-main','mainImage'],['offer-small','smallThumb'],['offer-description','description']])value(id,o[key]);
    renderRewards('items');renderRewards('bonusItems');$('raw').value=JSON.stringify(o,null,2)
  }
  function renderRewards(kind){const host=$(kind),o=group().offers[selectedOffer];host.innerHTML='';for(const [i,item] of (o?.[kind]||[]).entries()){const d=item.data||{};const row=document.createElement('div');row.className='reward-row';row.innerHTML='<div class="reward-head"><b>#'+(i+1)+'</b><button class="btn btn--danger btn--small" type="button">删除</button></div><div class="reward-grid"><label class="field"><span>itemType</span><select data-k="type"><option>gold</option><option>diamonds</option><option>dust</option><option>pack</option><option>card</option><option>draft</option><option>medkit</option><option>prop</option><option>alt_art</option><option>avatar</option><option>cardback</option><option>emote</option><option>deck</option><option>token</option><option>equipment</option></select></label><label class="field"><span>数量</span><input data-k="qty" type="number" min="1"></label><label class="field"><span>name</span><input data-k="name"></label><label class="field"><span>cardSet</span><input data-k="cardSet"></label><label class="field"><span>cardCount</span><input data-k="cardCount" type="number" min="0"></label><label class="field"><span>duration</span><input data-k="duration" type="number" min="0"></label><label class="field"><span>month</span><input data-k="month" type="number" min="1"></label><label class="field"><span>year</span><input data-k="year" type="number" min="0"></label><label class="field"><span>闪卡</span><select data-k="isGold"><option value="">未设置</option><option value="true">是</option><option value="false">否</option></select></label></div>';
      const set=(k,v)=>{if(v!==undefined&&v!==null){const el=row.querySelector('[data-k="'+k+'"]');if(el)el.value=String(v)}};set('type',d.itemType||'gold');set('qty',item.qty||1);for(const k of ['name','cardSet','cardCount','duration','month','year'])set(k,d[k]);set('isGold',d.isGold);row.querySelector('button').onclick=()=>{o[kind].splice(i,1);renderEditor()};for(const el of row.querySelectorAll('[data-k]'))el.onchange=()=>{const k=el.dataset.k;if(k==='type')d.itemType=el.value;else if(k==='qty')item.qty=Math.max(1,num(el.value,1));else if(k==='isGold'){if(el.value==='')delete d.isGold;else d.isGold=el.value==='true'}else{const n=['cardCount','duration','month','year'].includes(k);if(el.value==='')delete d[k];else d[k]=n?num(el.value):el.value}item.data=d};host.appendChild(row)}
  }
  function renderAll(){renderGroups();renderOffers();renderEditor();$('currency').value=state?.currency||'USD'}
  function bindFields(){for(const [id,key] of [['group-id','groupId'],['group-type','group'],['group-start','startDate'],['group-end','endDate']])$(id).onchange=()=>{const g=group();if(g)g[key]=['groupId','group'].includes(key)?num($(id).value):$(id).value};$('group-hidden').onchange=()=>{const g=group();if(g)g.hidden=$('group-hidden').checked;};const fields=[['offer-id','offerId','n'],['offer-name','offerName'],['offer-title','title'],['offer-gold','gold','n'],['offer-diamonds','diamonds','n'],['offer-real','real','n'],['offer-limit','limit','n'],['offer-priority','priority','n'],['offer-slot','slotType'],['offer-slot-value','slotValue'],['offer-fulfil','fulfilAfter'],['offer-thumb','thumbnail'],['offer-main','mainImage'],['offer-small','smallThumb'],['offer-description','description']];for(const [id,key,type] of fields)$(id).onchange=()=>{const o=group()?.offers?.[selectedOffer];if(!o)return;const v=$(id).value;if(v===''&&type!=='n')delete o[key];else o[key]=type==='n'?num(v):v}}
  async function load(){const r=await Admin.api('/store');if(!r?.ok)throw Error(r?.message||'读取失败');state=normalize(r.config);selectedGroup='featured';selectedOffer=-1;renderAll();$('store-path').textContent=r.path||'config/store.json'}
  $('add-group').onclick=()=>{const g=emptyGroup();state.groups.push(g);selectedGroup=String(g.groupId);selectedOffer=-1;renderAll()};$('add-offer').onclick=()=>{const g=group();if(!g)return;const o=emptyOffer();g.offers.push(o);selectedOffer=g.offers.length-1;renderAll()};$('delete').onclick=()=>{const g=group();if(!g||selectedOffer<0)return;if(!confirm('删除当前商品？'))return;g.offers.splice(selectedOffer,1);selectedOffer=-1;renderAll()};document.querySelectorAll('[data-add-reward]').forEach(b=>b.onclick=()=>{const o=group()?.offers?.[selectedOffer];if(!o)return;o[b.dataset.addReward].push({data:{itemType:'gold'},qty:1});renderEditor()});
  $('save').onclick=async()=>{try{const r=await Admin.api('/store',{method:'PUT',body:{config:state}});Admin.banner(r.message||'保存失败',r.ok?'ok':'err');if(r.ok){state=normalize(r.config||state);renderAll()}}catch(e){Admin.banner(e.message,'err')}};$('reload').onclick=async()=>{try{await load();Admin.banner('商店配置已重新读取','ok')}catch(e){Admin.banner(e.message,'err')}};$('download').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='store.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('format-raw').onclick=()=>{try{$('raw').value=JSON.stringify(JSON.parse($('raw').value),null,2)}catch(e){Admin.banner('商品 JSON 格式错误：'+e.message,'err')}};$('apply-raw').onclick=()=>{try{const o=JSON.parse($('raw').value);if(!o||typeof o!=='object')throw Error('必须是 JSON 对象');group().offers[selectedOffer]=o;renderEditor();Admin.banner('已应用到当前商品，点击保存后写入文件','ok')}catch(e){Admin.banner('商品 JSON 格式错误：'+e.message,'err')}};
  bindFields();try{await load()}catch(e){Admin.banner(e.message,'err')}
})();
</script>
</body>
</html>
