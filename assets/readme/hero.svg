<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
  <title id="title">fyserver service overview</title>
  <desc id="desc">A game client connects to fyserver over HTTP and WebSocket, while an administrator uses the web console.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#1e293b" flood-opacity=".15"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#4f75ee"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="744" height="434" rx="34" fill="url(#canvas)"/>
  <circle cx="380" cy="220" r="150" fill="#c7d2fe" opacity=".26"/>

  <path d="M202 220 C236 220 246 190 282 190" fill="none" stroke="url(#flow)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M478 190 C515 190 524 220 558 220" fill="none" stroke="url(#flow)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="242" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569">HTTP · WS</text>
  <text x="520" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569">ADMIN API</text>

  <g filter="url(#shadow)">
    <rect x="28" y="133" width="174" height="184" rx="22" fill="#fff" stroke="#dbe4f0"/>
    <rect x="49" y="154" width="132" height="86" rx="14" fill="#eff6ff"/>
    <path d="M65 215 89 178l23 37z" fill="#38bdf8"/>
    <path d="m96 215 24-45 27 45z" fill="#818cf8"/>
    <path d="m126 215 18-30 20 30z" fill="#fb923c"/>
    <circle cx="146" cy="172" r="8" fill="#facc15"/>
    <text x="115" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="1.2" fill="#0f172a">KARDS CLIENT</text>
    <text x="115" y="291" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">match · decks · store</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="282" y="104" width="196" height="232" rx="26" fill="url(#server)"/>
    <circle cx="380" cy="143" r="18" fill="#ffffff" opacity=".16"/>
    <path d="M372 135h16v16h-16zM376 130v5m8-5v5m-12 8h-5m5 4h-5m28-4h-5m5 4h-5m-11 8v5m4-5v5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="380" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#fff">fyserver</text>
    <rect x="307" y="196" width="146" height="32" rx="10" fill="#fff" opacity=".17"/>
    <circle cx="324" cy="212" r="4" fill="#86efac"/>
    <path d="M338 207h99M338 216h70" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"/>
    <rect x="307" y="238" width="146" height="32" rx="10" fill="#fff" opacity=".17"/>
    <circle cx="324" cy="254" r="4" fill="#86efac"/>
    <path d="M338 249h99M338 258h57" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"/>
    <text x="380" y="303" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#e0e7ff">ASP.NET CORE · .NET 10</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="558" y="133" width="174" height="184" rx="22" fill="#fff" stroke="#dbe4f0"/>
    <rect x="578" y="153" width="134" height="92" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="578" y="153" width="134" height="19" rx="12" fill="#eef2ff"/>
    <circle cx="590" cy="163" r="3" fill="#818cf8"/>
    <circle cx="600" cy="163" r="3" fill="#38bdf8"/>
    <rect x="589" y="184" width="42" height="48" rx="8" fill="#dbeafe"/>
    <path d="M598 219v-12l8-8 7 5 8-11" fill="none" stroke="#4f75ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="640" y="184" width="59" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="640" y="201" width="49" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="640" y="216" width="55" height="8" rx="4" fill="#e2e8f0"/>
    <text x="645" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="1.1" fill="#0f172a">ADMIN CONSOLE</text>
    <text x="645" y="291" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Vue 3 · /admin-ui/</text>
  </g>

  <circle cx="240" cy="220" r="4" fill="#38bdf8"/>
  <circle cx="520" cy="220" r="4" fill="#6366f1"/>
</svg>
