<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>内容配置 · fyserver 后台</title>
    <link rel="stylesheet" href="/admin-ui/assets/admin.css" />
</head>
<body>
<main class="page">
    <div id="banner-host"></div>
    <div class="page-head">
        <h1>内容配置</h1>
        <p>首页公告（带游戏内预览）、乱斗、淘汰赛；落盘到 <span class="mono">config/*.json</span>，保存前校验 JSON 并备份 <span class="mono">.bak</span>；未建模字段原样保留。</p>
    </div>

    <div class="card">
        <div class="btn-row">
            <label class="muted" for="kind">配置类型</label>
            <select id="kind" style="max-width:220px">
                <option value="frontpage">首页 / 公告（frontpage）</option>
                <option value="skirmish">乱斗（skirmish）</option>
                <option value="knockout">淘汰赛（knockout）</option>
            </select>
            <button class="btn" id="new-entry">新建条目</button>
            <button class="btn btn--outline" id="refresh">刷新列表</button>
            <span class="muted" id="content-path"></span>
        </div>
    </div>

    <div class="card">
        <h2>条目列表</h2>
        <div class="table-wrap" id="entry-table"></div>
    </div>

    <form id="entry-form" style="display:none">
        <div class="split-2">
            <div class="card">
                <h2 id="editor-title">编辑条目</h2>
                <div class="form-grid">
                    <div class="field">
                        <label for="name">名称（写入 name，用于列表显示）</label>
                        <input type="text" id="name" />
                    </div>
                    <div class="field">
                        <label for="startDate">开始时间</label>
                        <input type="text" id="startDate" placeholder="2026-01-01 00:00:00" />
                    </div>
                    <div class="field">
                        <label for="endDate">结束时间</label>
                        <input type="text" id="endDate" placeholder="9999-12-31 23:59:00" />
                    </div>
                </div>
                <div class="field">
                    <label for="raw">完整条目 JSON（<span id="raw-hint" class="mono"></span>）</label>
                    <textarea id="raw" class="json" spellcheck="false"></textarea>
                </div>
                <div class="btn-row">
                    <button class="btn" type="submit">保存</button>
                    <button class="btn btn--outline" type="button" id="format">格式化</button>
                    <button class="btn btn--danger" type="button" id="delete-entry">删除该条目</button>
                    <button class="btn btn--outline" type="button" id="cancel">取消</button>
                    <span class="muted mono" id="entry-id"></span>
                </div>
            </div>

            <div class="card" id="preview-card">
                <h2>游戏内预览</h2>
                <div class="field">
                    <label for="preview-language">预览语言</label>
                    <select id="preview-language">
                        <option value="zh-hans">zh-hans</option>
                        <option value="en-en">en-en</option>
                        <option value="zh-hant">zh-hant</option>
                        <option value="ja-jp">ja-jp</option>
                        <option value="ko-kr">ko-kr</option>
                        <option value="ru-ru">ru-ru</option>
                        <option value="de-de">de-de</option>
                        <option value="fr-fr">fr-fr</option>
                        <option value="es-es">es-es</option>
                        <option value="it-it">it-it</option>
                        <option value="pl-pl">pl-pl</option>
                        <option value="pt-br">pt-br</option>
                    </select>
                </div>
                <div class="preview-pane">
                    <div class="preview-stage" id="fp-preview-stage"></div>
                    <div class="preview-meta" id="fp-preview-meta"></div>
                    <p class="muted" style="margin:0">按客户端画布尺寸渲染（轮播 1540×770 / 侧栏按钮 614×307 / 弹窗 1232×564），修改 JSON 即时刷新；仅首页条目有预览。</p>
                </div>
            </div>
        </div>
    </form>
</main>
<footer class="page-footer">FYServer · Server Control Center</footer>

<template id="fp-template-carousel">
    <div class="fp-carousel" style="width:auto;height:auto">
        <svg width="100%" height="100%" viewBox="0 0 1540 770" preserveAspectRatio="xMinYMid meet" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="fp-blacktint" x1="0" x2="0" y1="0" y2="1">
                    <stop offset="0%" stop-color="black" stop-opacity="0" />
                    <stop offset="100%" stop-color="black" />
                </linearGradient>
            </defs>
            <image data-field="image" href="" x="0" y="0" height="100%" width="100%" />
            <rect x="9.2%" y="66.66%" width="100%" height="33.34%" fill="url(#fp-blacktint)" />
            <text data-field="heading" x="13%" y="717.64" font-family="Roboto Condensed, sans-serif" fill="#e4e4d1" font-size="56"></text>
            <text data-field="sub_heading" x="13%" y="93.2%" font-family="Roboto Condensed, sans-serif" fill="#e4e4d1" font-size="30"></text>
        </svg>
    </div>
</template>

<template id="fp-template-button">
    <div class="fp-button" style="width:auto;height:auto">
        <svg width="100%" height="100%" viewBox="0 0 614 307" preserveAspectRatio="xMinYMid meet" xmlns="http://www.w3.org/2000/svg">
            <image data-field="image" href="" x="0" y="0" height="100%" width="100%" />
            <image data-field="icon" href="" x="16" y="16" width="96" height="96" />
            <text data-field="heading" x="13%" y="150" font-family="Roboto Condensed, sans-serif" fill="#e4e4d1" font-size="56"></text>
            <text data-field="sub_heading" x="13%" y="210" font-family="Roboto Condensed, sans-serif" fill="#e4e4d1" font-size="30"></text>
        </svg>
    </div>
</template>

<template id="fp-template-popup">
    <div class="fp-popup" style="width:auto;height:auto">
        <svg width="100%" height="100%" viewBox="0 0 1232 564" preserveAspectRatio="xMinYMid meet" xmlns="http://www.w3.org/2000/svg">
            <image data-field="image" href="" x="0" y="0" height="100%" width="100%" />
            <text data-field="heading" x="13%" y="300" font-family="Roboto Condensed, sans-serif" fill="#e4e4d1" font-size="56"></text>
            <text data-field="sub_heading" x="13%" y="360" font-family="Roboto Condensed, sans-serif" fill="#e4e4d1" font-size="30"></text>
        </svg>
    </div>
</template>

<script src="/admin-ui/assets/admin.js"></script>
<script src="/admin-ui/assets/admin-frontpage-preview.js"></script>
<script>
    (async function () {
        if (!await Admin.ensureAuth()) return;
        Admin.mount('content', '内容');

        const kindSelect = document.getElementById('kind');
        const form = document.getElementById('entry-form');
        const raw = document.getElementById('raw');
        const previewCard = document.getElementById('preview-card');
        let currentId = 0;

        function kind() { return kindSelect.value; }

        function isFrontpage() { return kind() === 'frontpage'; }

        function updatePreview() {
            if (!isFrontpage()) { previewCard.style.display = 'none'; return; }
            previewCard.style.display = '';
            FpPreview.render(raw.value, 'fp-preview-stage', 'fp-preview-meta');
        }

        async function loadList() {
            const data = await Admin.api('/content/' + kind());
            document.getElementById('content-path').textContent = 'config/' + kind() + '.json';
            const entries = (data && data.entries) || [];
            document.getElementById('entry-table').innerHTML = '<table class="md-table"><thead><tr>' +
                '<th>ID</th><th>名称</th><th>开始</th><th>结束</th><th>操作</th></tr></thead><tbody>' +
                (entries.length === 0 ? '<tr><td colspan="5" class="empty">还没有条目</td></tr>' : entries.map(function (e) {
                    return '<tr><td class="mono">' + e.id + '</td><td>' + Admin.esc(e.name) + '</td>' +
                        '<td class="mono">' + Admin.esc(e.startDate) + '</td><td class="mono">' + Admin.esc(e.endDate) + '</td>' +
                        '<td><div class="btn-row"><button class="btn btn--small btn--outline" data-edit="' + e.id + '">编辑</button>' +
                        '<button class="btn btn--small btn--danger" data-del="' + e.id + '">删除</button></div></td></tr>';
                }).join('')) + '</tbody></table>';
        }

        async function openEntry(id) {
            currentId = id;
            if (id > 0) {
                const entry = await Admin.api('/content/' + kind() + '/' + id);
                if (!entry) { Admin.banner('条目不存在', 'err'); return; }
                document.getElementById('name').value = entry.name || '';
                document.getElementById('startDate').value = entry.startDate || '';
                document.getElementById('endDate').value = entry.endDate || '';
                raw.value = entry.raw || '{}';
                document.getElementById('editor-title').textContent = '编辑条目 #' + id;
                document.getElementById('entry-id').textContent = '条目 #' + id;
            } else {
                document.getElementById('name').value = '';
                document.getElementById('startDate').value = '';
                document.getElementById('endDate').value = '';
                raw.value = isFrontpage()
                    ? JSON.stringify({ content: { type: 0, heading: { text: { _: '' }, font_size: { _: 56 } }, sub_heading: { text: { _: '' }, font_size: { _: 30 } }, image_url: { _: '' }, link: { _: '' } }, is_published: true }, null, 2)
                    : (kind() === 'skirmish'
                        ? JSON.stringify({ rules: { localization: { EN: { rules_list: '', description: '' }, 'ZH-HANS': { rules_list: '', description: '' } }, blacklist: [], reward: { type: 'gold', amount: 100 }, turn_length: 90 } }, null, 2)
                        : JSON.stringify({ entry_prices: { gold: 0, diamonds: 0, ticket: 0, points: 0 }, deck_rules: { allow_reserved: false, allow_more_ally_cards: false, allow_unowned: false }, turn_timers: { turn_length: 90, length_after_timeout: 30 }, rewards: [], texts: {}, active_period: { days: [], hour_from: 0, hour_to: 24 } }, null, 2));
                document.getElementById('editor-title').textContent = '新建条目';
                document.getElementById('entry-id').textContent = '（新建）';
            }
            document.getElementById('raw-hint').textContent = isFrontpage() ? 'content 之下为条目内容' : 'rules 之下为该类型的规则';
            form.style.display = '';
            updatePreview();
            form.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            const r = await Admin.api('/content/' + kind() + (currentId > 0 ? '/' + currentId : ''), {
                method: 'POST',
                body: {
                    name: document.getElementById('name').value,
                    startDate: document.getElementById('startDate').value,
                    endDate: document.getElementById('endDate').value,
                    raw: raw.value
                }
            });
            Admin.banner((r && r.message) || '完成', r && r.ok ? 'ok' : 'err');
            if (r && r.ok) { await loadList(); form.style.display = 'none'; }
        });

        document.getElementById('format').addEventListener('click', function () {
            try {
                raw.value = JSON.stringify(JSON.parse(raw.value), null, 2);
                updatePreview();
                Admin.banner('已格式化（尚未保存）', 'ok');
            } catch (e) { Admin.banner('JSON 格式错误：' + e.message, 'err'); }
        });

        document.getElementById('delete-entry').addEventListener('click', async function () {
            if (currentId <= 0) return;
            if (!confirm('确认删除条目 #' + currentId + '？原文件会备份为 .bak。')) return;
            const r = await Admin.api('/content/' + kind() + '/' + currentId, { method: 'DELETE' });
            Admin.banner((r && r.message) || '完成', r && r.ok ? 'ok' : 'err');
            form.style.display = 'none';
            await loadList();
        });

        document.getElementById('cancel').addEventListener('click', function () { form.style.display = 'none'; });
        document.getElementById('new-entry').addEventListener('click', function () { openEntry(0); });
        document.getElementById('refresh').addEventListener('click', loadList);
        raw.addEventListener('input', updatePreview);
        document.getElementById('preview-language').addEventListener('change', function (event) {
            FpPreview.setLanguage(event.target.value);
            updatePreview();
        });

        kindSelect.addEventListener('change', async function () {
            form.style.display = 'none';
            await loadList();
        });

        document.addEventListener('click', async function (event) {
            const edit = event.target.closest('[data-edit]');
            if (edit) { event.preventDefault(); await openEntry(parseInt(edit.getAttribute('data-edit'), 10)); return; }
            const del = event.target.closest('[data-del]');
            if (del) {
                event.preventDefault();
                const id = parseInt(del.getAttribute('data-del'), 10);
                if (!confirm('确认删除条目 #' + id + '？原文件会备份为 .bak。')) return;
                const r = await Admin.api('/content/' + kind() + '/' + id, { method: 'DELETE' });
                Admin.banner((r && r.message) || '完成', r && r.ok ? 'ok' : 'err');
                await loadList();
            }
        });

        FpPreview.setLanguage(document.getElementById('preview-language').value);
        await loadList();
    })();
</script>
</body>
</html>
