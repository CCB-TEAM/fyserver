<!doctype html>
<html lang="zh-Hans">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>玩家数据库初始化 · FYServer</title><link rel="stylesheet" href="/admin-ui/assets/admin-v4.css?v=20260923-2"></head>
<body>
<main class="page">
  <div id="banner-host"></div>
  <div class="page-head"><p class="dashboard-eyebrow">FIRST-RUN SETUP</p><h1>配置玩家数据库</h1><p>完成连接测试与数据表初始化后，游戏接口才会开始提供服务。数据库密码会加密保存在服务器本地，不会回传到浏览器。</p></div>
  <section class="card">
    <form id="database-form">
      <div class="form-grid database-grid">
        <label class="field"><span>存储类型</span><select id="provider"><option value="postgresql">PostgreSQL</option><option value="mysql">MySQL</option><option value="local">本地 FASTER（兼容旧数据）</option></select><small>新部署推荐使用 PostgreSQL 或 MySQL；本地模式无需外部数据库。</small></label>
        <label class="field remote"><span>主机 / IP</span><input id="host" autocomplete="off" placeholder="127.0.0.1"></label>
        <label class="field remote"><span>端口</span><input id="port" type="number" min="1" max="65535"></label>
        <label class="field remote"><span>数据库名</span><input id="database" autocomplete="off" placeholder="fyserver"></label>
        <label class="field remote"><span>数据库用户名</span><input id="username" autocomplete="username" placeholder="fyserver"></label>
        <label class="field remote"><span>数据库密码</span><input id="password" type="password" autocomplete="new-password" placeholder="留空可沿用已保存的密码"><small>密码不会显示或由接口返回。</small></label>
        <label class="field remote"><span>传输加密</span><select id="require-ssl"><option value="true">要求 SSL/TLS</option><option value="false">优先使用加密（允许本地无 TLS）</option></select></label>
      </div>
      <div class="btn-row"><button class="btn" id="save" type="submit">测试连接并完成初始化</button><button class="btn btn--outline" id="reload" type="button">读取已保存配置</button></div>
    </form>
  </section>
  <section class="card"><h2>初始化说明</h2><p class="muted">目标数据库需要预先存在，所填账号需要在该数据库中创建表的权限。FYServer 会自动创建 <span class="mono">fy_users</span> 表，不会修改数据库中的其它表。切换存储不会自动迁移已有玩家数据。</p><p class="muted" id="state">正在读取状态…</p></section>
</main><footer class="page-footer">FYServer · Server Control Center</footer>
<script src="/admin-ui/assets/admin-v4.js?v=20260922-1"></script>
<script>
(async function(){
if(!await Admin.ensureAuth())return;const session=await Admin.api('/session');if(!session?.isOwner){Admin.banner('只有 Owner 可以完成玩家数据库初始化','err');return}Admin.mount('system-settings','玩家数据库初始化');
const $=id=>document.getElementById(id),provider=$('provider');
function toggle(){const remote=provider.value!=='local';document.querySelectorAll('.remote').forEach(x=>x.hidden=!remote);['host','port','database','username'].forEach(id=>$(id).required=remote);if(remote&&!$('port').value)$('port').value=provider.value==='mysql'?3306:5432}
provider.onchange=()=>{$('port').value=provider.value==='mysql'?3306:provider.value==='postgresql'?5432:'';toggle()};
async function load(){const d=await Admin.api('/database');if(!d)return;provider.value=d.provider||'postgresql';$('host').value=d.host||'127.0.0.1';$('port').value=d.port||((provider.value==='mysql')?3306:5432);$('database').value=d.database||'fyserver';$('username').value=d.username||'fyserver';$('require-ssl').value=String(d.requireSsl!==false);$('state').textContent=d.ready?'玩家数据库已就绪，服务器正在正常提供服务。':(d.initializationError?'初始化失败：'+d.initializationError:'尚未完成配置，游戏接口当前返回 503。');toggle()}
$('reload').onclick=load;$('database-form').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;const body={provider:provider.value,host:$('host').value.trim(),port:Number($('port').value),database:$('database').value.trim(),username:$('username').value.trim(),password:$('password').value,requireSsl:$('require-ssl').value==='true'};try{const r=await Admin.api('/database/configure',{method:'POST',body});Admin.banner(r?.message||'初始化失败',r?.ok?'ok':'err');if(r?.ok){$('password').value='';setTimeout(()=>location.replace('/admin-ui/index.html'),600)}}finally{$('save').disabled=false}};await load();
})();
</script></body></html>
